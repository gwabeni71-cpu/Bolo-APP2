<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOLO – Music, TV, Movies &amp; News</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Music, Live TV and Movies in one app by Kutullo Angel Media">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BOLO">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--gold:#ffcc00;--tab-h:58px;--banner-h:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
#frames{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--banner-h));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));transition:top .3s}
.pane{position:absolute;inset:0;display:none;background:#000}
.pane.on{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:#000}
.pane .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;background:#000;transition:opacity .4s}
.pane .ld.done{opacity:0;pointer-events:none}
.ld i{width:4px;height:26px;border-radius:2px;background:linear-gradient(to top,#9c27b0,#e01b5d,var(--gold));animation:eq 1s ease-in-out infinite alternate}
.ld i:nth-child(2){animation-delay:.15s}.ld i:nth-child(3){animation-delay:.3s}.ld i:nth-child(4){animation-delay:.45s}.ld i:nth-child(5){animation-delay:.6s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:linear-gradient(180deg,#0d0d0d,#000);border-top:1px solid rgba(255,204,0,.45);box-shadow:0 -6px 24px rgba(0,0,0,.8)}
nav button{flex:1;position:relative;background:0;border:0;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:800 9px/1 inherit;letter-spacing:1px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:color .2s}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--gold)}
nav button.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 6px rgba(255,204,0,.55))}
nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 4px 4px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
nav button:active svg{transform:scale(.9)}
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 40%,#1a1500,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash img.l{width:112px;height:112px;border-radius:26px;border:2px solid var(--gold);box-shadow:0 0 40px rgba(255,204,0,.3);animation:pu 2.2s ease-in-out infinite}
#splash h1{margin:0;font-size:20px;letter-spacing:6px;font-weight:900;color:var(--gold);text-transform:uppercase}
#splash p{margin:0;font-size:9px;letter-spacing:2.5px;color:#777;text-transform:uppercase}
#splash .k{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:2px;color:#666;text-transform:uppercase}
#splash .k img{width:30px;height:30px;border-radius:8px;object-fit:cover}
@keyframes pu{50%{transform:scale(1.05);box-shadow:0 0 60px rgba(255,204,0,.5)}}
#ib{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:60;height:var(--bh,64px);display:none;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#161200,#0a0a0a);border-bottom:2px solid var(--gold)}
#ib.show{display:flex}
#ib img{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--gold);flex-shrink:0}
#ib div{flex:1;min-width:0}
#ib b{display:block;font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.3px}
#ib span{display:block;font-size:10px;color:#aaa;margin-top:2px;line-height:1.3}
#ib button.go{background:linear-gradient(135deg,var(--gold),#f5a623);color:#000;border:0;border-radius:30px;padding:8px 16px;font:800 10px inherit;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;flex-shrink:0}
#ib button.x{background:0;border:0;color:#777;font-size:18px;cursor:pointer;padding:4px}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:70;background:#222;color:var(--gold);border:1px solid var(--gold);padding:8px 18px;border-radius:30px;font-size:12px;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="splash">
  <img class="l" src="icon-192.png" alt="BOLO">
  <h1>BOLO</h1><p>Music • Live TV • Movies</p>
  <div class="k"><img src="kutullo-logo.jpg" alt=""><span>Kutullo Angel Media</span></div>
</div>

<div id="ib" role="dialog" aria-label="Install BOLO">
  <img src="icon-192.png" alt="">
  <div><b>Install BOLO</b><span id="ibText">Music, Live TV &amp; Movies in one app — fast, full screen, on your home screen.</span></div>
  <button class="go" id="ibGo">Install</button>
  <button class="x" id="ibX" aria-label="Dismiss">✕</button>
</div>

<div id="frames">
  <div class="pane" id="p-music"><div class="ld"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="pane" id="p-tv"><div class="ld"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="pane" id="p-movies"><div class="ld"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="pane" id="p-news"><div class="ld"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="pane" id="p-dream"><div class="ld"><i></i><i></i><i></i><i></i><i></i></div></div>
</div>

<nav id="tabs">
  <button data-t="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Music</button>
  <button data-t="tv"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>Live TV</button>
  <button data-t="movies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>Movies</button>
  <button data-t="news"><svg viewBox="0 0 24 24"><path d="M4 4h13a2 2 0 012 2v14H6a2 2 0 01-2-2V4z"/><path d="M19 8h1a1 1 0 011 1v9a2 2 0 01-2 2M8 8h7M8 12h7M8 16h4"/></svg>News</button>
  <button data-t="dream"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/><path d="M17 4v3M15.5 5.5h3"/></svg>Dreams</button>
</nav>
<div id="toast"></div>

<script>
(function(){
  var PAGES={music:'music.html',tv:'tv.html',movies:'movies.html',news:'news.html',dream:'dream.html'},cur=null,$=function(s){return document.querySelector(s)};
  var ALLOW='autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';

  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2600)}

  function frameOf(t){return $('#p-'+t+' iframe')}
  function pause(t){ // pause any YouTube player inside a tab we are leaving
    var f=frameOf(t);if(!f)return;
    try{f.contentDocument.querySelectorAll('iframe').forEach(function(y){
      y.contentWindow.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'*')})}catch(e){}
  }
  function load(t){
    var p=$('#p-'+t);if(frameOf(t))return;
    var f=document.createElement('iframe');
    f.src=PAGES[t];f.setAttribute('allow',ALLOW);f.allowFullscreen=true;f.title=t;
    f.addEventListener('load',function(){p.querySelector('.ld').classList.add('done')});
    p.insertBefore(f,p.firstChild);
  }
  function show(t,fromHash){
    if(!PAGES[t])t='music';
    if(t===cur){ // tap active tab again -> scroll to top
      try{frameOf(t).contentWindow.scrollTo({top:0,behavior:'smooth'})}catch(e){}return}
    if(cur)pause(cur);
    cur=t;load(t);
    document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t)});
    document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
    if(!fromHash)history.replaceState(null,'','#'+t);
    try{localStorage.setItem('bolo_tab',t)}catch(e){}
    if(navigator.vibrate)navigator.vibrate(8);
  }
  document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.t)})});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),true)});
  var start=location.hash.slice(1);
  show(PAGES[start]?start:'music',true);

  window.addEventListener('load',function(){setTimeout(function(){$('#splash').classList.add('hide')},900)});

  /* ---------- Install banner ---------- */
  var ib=$('#ib'),dp=null,standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  function dismissed(){try{return Date.now()-(+localStorage.getItem('bolo_ib')||0)<6048e5}catch(e){return false}}
  function showBanner(){
    if(standalone||dismissed())return;
    ib.classList.add('show');document.documentElement.style.setProperty('--banner-h',ib.offsetHeight+'px');
  }
  function hideBanner(){ib.classList.remove('show');document.documentElement.style.setProperty('--banner-h','0px');try{localStorage.setItem('bolo_ib',Date.now())}catch(e){}}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;setTimeout(showBanner,2500)});
  $('#ibGo').addEventListener('click',function(){
    if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;hideBanner()})}
    else toast('Tap Share, then “Add to Home Screen”');
  });
  $('#ibX').addEventListener('click',hideBanner);
  window.addEventListener('appinstalled',function(){hideBanner();toast('BOLO installed ✓')});
  if(ios&&!standalone){
    $('#ibText').textContent='Tap the Share button, then “Add to Home Screen” to install.';
    $('#ibGo').style.display='none';setTimeout(showBanner,3500);
  }

  window.addEventListener('offline',function(){toast('You are offline')});
  window.addEventListener('online',function(){toast('Back online')});
  if('serviceWorker' in navigator&&location.protocol!=='file:')
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
